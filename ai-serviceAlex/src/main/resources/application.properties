# Server Configuration
server.port=5055

# Application Name
spring.application.name=ai-recommendation-service

# ===============================
# R2DBC PostgreSQL Configuration
# ===============================
spring.r2dbc.url=r2dbc:postgresql://localhost:2526/AlexzAiRecomm
spring.r2dbc.username=postgres
spring.r2dbc.password=2526
spring.r2dbc.pool.initial-size=10
spring.r2dbc.pool.max-size=50
spring.r2dbc.pool.max-idle-time=30m

# ===============================
# RabbitMQ Configuration
# ===============================
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.prefetch=10
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=3000
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.multiplier=2.0

# ===============================
# Eureka Client Configuration
# ===============================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1

# ===============================
# RabbitMQ Custom Queues
# ===============================
rabbitmq.exchange.recommendation=recommendation.exchange
rabbitmq.queue.recommendation-request=recommendation.request.queue
rabbitmq.routing-key.recommendation-request=recommendation.request

# ===============================
# Gemini AI Configuration
# ===============================
gemini.api.key=${GEMINI_API_KEY:AIzaSyAdcYO4G7nxYZFaL2olONaeC4ObpUiix5s}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent
gemini.api.timeout=30000
gemini.api.max-retries=3

# ===============================
# Logging Configuration
# ===============================
logging.level.com.crypto.ecosystem.ai=DEBUG
logging.level.org.springframework.amqp=INFO
logging.level.org.springframework.r2dbc=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ===============================
# Actuator
# ===============================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
