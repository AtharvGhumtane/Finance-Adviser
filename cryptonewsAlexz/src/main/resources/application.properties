# ===============================
# Application Configuration
# ===============================
spring.application.name=crypto-news-service
server.port=5056

# ===============================
# Database Configuration
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:2526/crypto_news_db
spring.datasource.username=postgres
spring.datasource.password=2526
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# Kafka Configuration
# ===============================
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

# KAFKA CONSUMER LINES :
spring.kafka.consumer.group-id=crypto-news-consumer-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.enable-auto-commit=true

# Kafka Topics
kafka.topic.crypto-news=crypto.news
kafka.topic.price-updates=crypto.price

# ===============================
# Eureka Client Configuration
# ===============================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1

# ===============================
# News API Configuration
# ===============================
news.api.cryptocompare.url=https://min-api.cryptocompare.com/data/v2/news/
news.api.coingecko.url=https://api.coingecko.com/api/v3/news
news.fetch.interval.minutes=5
news.max.items=50

# ===============================
# WebSocket Configuration
# ===============================
websocket.allowed.origins=*

# CORS Configuration
spring.web.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:5051
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true
# ===============================
# Logging Configuration
# ===============================
logging.level.com.alex.crypto_news_service=DEBUG
logging.level.org.springframework.kafka=INFO
logging.level.org.springframework.web.socket=DEBUG

# ===============================
# Actuator
# ===============================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always