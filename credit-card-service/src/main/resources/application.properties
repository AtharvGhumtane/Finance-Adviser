# ===============================
# Application
# ===============================
spring.application.name=credit-card-service
server.port=5058

# ===============================
# R2DBC PostgreSQL
# ===============================
spring.r2dbc.url=${SPRING_R2DBC_URL:r2dbc:postgresql://localhost:2526/credit_card_db}
spring.r2dbc.username=${SPRING_R2DBC_USERNAME:postgres}
spring.r2dbc.password=${SPRING_R2DBC_PASSWORD:2526}

# ===============================
# Gemini AI Configuration
# ===============================
gemini.api.key=${GEMINI_API_KEY:your_gemini_api_key_here}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent
gemini.api.timeout=30000
gemini.api.max-retries=3
gemini.api.model=gemini-2.0-flash

# ===============================
# RabbitMQ
# ===============================
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.virtual-host=/

rabbitmq.queue.credit-analysis=credit.analysis.queue
rabbitmq.queue.credit-analysis-dlq=credit.analysis.dlq
rabbitmq.exchange.credit-card=credit.card.exchange
rabbitmq.exchange.credit-card-dlx=credit.card.dlx
rabbitmq.routing-key.credit-analysis=credit.analysis
rabbitmq.routing-key.credit-analysis-dlq=credit.analysis.dead

# ===============================
# Eureka Client
# ===============================
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=false

# ===============================
# Credit Risk Thresholds
# ===============================
credit.utilization.warning-threshold=30.0
credit.utilization.danger-threshold=75.0
credit.emi.burden-limit=50.0
credit.dti.safe-limit=40.0
credit.min-payment.interest-rate=36.0
credit.late-payment.high-risk-count=3

# ===============================
# Jackson
# ===============================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# ===============================
# CORS
# ===============================
spring.web.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:5051
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
spring.web.cors.allowed-headers=*

# ===============================
# Logging
# ===============================
logging.level.com.creditcard=DEBUG
logging.level.io.r2dbc=INFO
logging.level.org.springframework.r2dbc=DEBUG
logging.level.org.springframework.amqp=INFO

# ===============================
# Actuator
# ===============================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
