# ===============================
# Application Configuration
# ===============================
spring.application.name=tax-optimizer-service
server.port=5057

# ===============================
# R2DBC PostgreSQL Configuration
# ===============================
spring.r2dbc.url=${SPRING_R2DBC_URL:r2dbc:postgresql://localhost:2526/tax_Alexz}
spring.r2dbc.username=${SPRING_R2DBC_USERNAME:postgres}
spring.r2dbc.password=${SPRING_R2DBC_PASSWORD:2526}

# Explicit breakdown for R2DBCConfig bean
spring.r2dbc.host=${SPRING_R2DBC_HOST:localhost}
spring.r2dbc.port=${SPRING_R2DBC_PORT:2526}
spring.r2dbc.database=tax_optimizer_db

# ===============================
# Gemini AI Configuration
# ===============================
gemini.api.key=${GEMINI_API_KEY:your_gemini_api_key_here}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent
gemini.api.timeout=30000
gemini.api.max-retries=3
gemini.api.model=gemini-2.0-flash

# ===============================
# RabbitMQ Configuration
# ===============================
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.virtual-host=/

# Queue Names
rabbitmq.queue.tax-recommendation=tax.recommendation.queue
rabbitmq.queue.tax-recommendation-dlq=tax.recommendation.dlq

# Exchange Names
rabbitmq.exchange.tax-optimizer=tax.optimizer.exchange
rabbitmq.exchange.tax-optimizer-dlx=tax.optimizer.dlx

# Routing Keys
rabbitmq.routing-key.tax-recommendation=tax.recommendation
rabbitmq.routing-key.tax-recommendation-dlq=tax.recommendation.dead

# ===============================
# Eureka Client Configuration
# ===============================
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=false

# ===============================
# Tax Engine Configuration
# ===============================
tax.fy=2024-25
tax.ay=2025-26
tax.old-regime.standard-deduction=50000
tax.new-regime.standard-deduction=75000
tax.old-regime.section80c-limit=150000
tax.old-regime.section80ccd-limit=50000
tax.old-regime.section24b-limit=200000
tax.old-regime.section80tta-limit=10000
tax.cess.rate=0.04

# ===============================
# Jackson Configuration
# ===============================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# ===============================
# Logging Configuration
# ===============================
logging.level.com.taxoptimizer=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.amqp=INFO
logging.level.io.r2dbc=INFO
logging.level.org.springframework.r2dbc=DEBUG

# ===============================
# Actuator
# ===============================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
