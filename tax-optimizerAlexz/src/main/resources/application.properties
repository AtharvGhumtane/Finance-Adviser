# ===============================
# Application Configuration
# ===============================
spring.application.name=tax-optimizer-service
server.port=5057

# ===============================
# R2DBC PostgreSQL Configuration
# ===============================
spring.r2dbc.url=r2dbc:postgresql://localhost:2526/tax_Alexz
spring.r2dbc.username=postgres
spring.r2dbc.password=2526

# Explicit breakdown for R2DBCConfig bean
spring.r2dbc.host=localhost
spring.r2dbc.port=2526
spring.r2dbc.database=tax_optimizer_db


# ===============================
# Gemini AI Configuration
# ===============================
gemini.api.key=${GEMINI_API_KEY:AIzaSyAdcYO4G7nxYZFaL2olONaeC4ObpUiix5s}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent
gemini.api.timeout=30000
gemini.api.max-retries=3
gemini.api.model=gemini-2.5-flash

# ===============================
# RabbitMQ Configuration
# ===============================
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.virtual-host=/

# Queue Names
rabbitmq.queue.tax-recommendation=tax.recommendation.queue
rabbitmq.queue.tax-recommendation-dlq=tax.recommendation.dlq

# Exchange Names
rabbitmq.exchange.tax-optimizer=tax.optimizer.exchange
rabbitmq.exchange.tax-optimizer-dlx=tax.optimizer.dlx

# Routing Keys
rabbitmq.routing-key.tax-recommendation=tax.recommendation
rabbitmq.routing-key.tax-recommendation-dlq=tax.recommendation.dead

# ===============================
# Eureka Client Configuration
# ===============================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1

# ===============================
# Tax Engine Configuration
# ===============================
tax.fy=2024-25
tax.ay=2025-26
tax.old-regime.standard-deduction=50000
tax.new-regime.standard-deduction=75000
tax.old-regime.section80c-limit=150000
tax.old-regime.section80ccd-limit=50000
tax.old-regime.section24b-limit=200000
tax.old-regime.section80tta-limit=10000
tax.cess.rate=0.04


# ===============================
# Jackson Configuration
# ===============================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# ===============================
# Logging Configuration
# ===============================
logging.level.com.taxoptimizer=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.amqp=INFO
logging.level.io.r2dbc=INFO
logging.level.org.springframework.r2dbc=DEBUG

# ===============================
# Actuator
# ===============================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always